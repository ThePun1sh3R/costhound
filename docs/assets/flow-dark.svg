sans-serif" font-size="13.5" fill="#8b949e">price list, today</text></g><g class="s s2"><rect x="460" y="20" width="178" height="96" rx="14" fill="#161b22" stroke="#30363d"/><rect class="glow g2" x="460" y="20" width="178" height="96" rx="14" fill="none" stroke="#fb923c" stroke-width="2.5"/><text x="478" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3"><tspan fill="#fb923c">3</tspan>  Fix</text><text x="478" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b949e">a script that backs up,</text><text x="478" y="99" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b949e">verifies, rolls back</text></g><g class="s s3"><rect x="686" y="20" width="178" height="96" rx="14" fill="#161b22" stroke="#30363d"/><rect class="glow g3" x="686" y="20" width="178" height="96" rx="14" fill="none" stroke="#fb923c" stroke-width="2.5"/><text x="704" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#e6edf3"><tspan fill="#fb923c">4</tspan>  Prove</text><text x="704" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b949e">the next scan confirms</text><text x="704" y="99" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b949e">it and counts it once</text></g>
</svg>
