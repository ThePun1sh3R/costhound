<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="How it works: scan read-only, price from the cloud's price list, fix with a script that backs up and rolls back, prove the saving on the next scan">
