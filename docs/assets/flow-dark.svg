<style>.glow{opacity:0}@keyframes gk0{0%,0%{opacity:0}6%{opacity:1}20%,100%{opacity:0}}.g0{animation:gk0 6s ease-in-out infinite both}@keyframes gk1{0%,25%{opacity:0}31%{opacity:1}45%,100%{opacity:0}}.g1{animation:gk1 6s ease-in-out infinite both}@keyframes gk2{0%,50%{opacity:0}56%{opacity:1}70%,100%{opacity:0}}.g2{animation:gk2 6s ease-in-out infinite both}@keyframes gk3{0%,75%{opacity:0}81%{opacity:1}95%,100%{opacity:0}}.g3{animation:gk3 6s ease-in-out infinite both}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
