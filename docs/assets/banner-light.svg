<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="costhound: find cloud waste, fix it safely, prove what you saved">
<style>
.mark{animation:pop .7s ease-out both}
.sweep{animation:sweep 2.4s ease-in-out .4s both}
.tag{animation:fade .8s ease-out .5s both}
.chip{animation:rise .6s ease-out both}
.c0{animation-delay:.9s} .c1{animation-delay:1.05s} .c2{animation-delay:1.2s}
.coin{animation:coin 3.2s ease-in-out 1.6s infinite both;transform-origin:62px 62px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes coin{0%,70%,100%{transform:none}80%{transform:rotate(-12deg)}90%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g class="mark" transform="translate(0,26)">
  <g class="coin">
    <circle cx="62" cy="62" r="44" fill="none" stroke="#c2410c" stroke-width="6"/>
    <path d="M94 94 L122 122" stroke="#c2410c" stroke-width="10" stroke-linecap="round"/>
    <text x="62" y="80" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" fill="#c2410c">$</text>
  </g>
  <text x="150" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#1f2328"><tspan fill="#c2410c">cost</tspan>hound</text>
  <rect class="sweep" x="152" y="88" width="300" height="5" rx="2.5" fill="#c2410c" style="transform-origin:152px 90px"/>
  <text class="tag" x="152" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Find the waste on your cloud bill, fix it safely, prove what you saved.</text>
</g>
<g transform="translate(152,180)"><g class="chip c0" transform="translate(0,0)"><rect width="199" height="34" rx="17" fill="#eef1f4" stroke="#d1d9e0"/><circle cx="17" cy="17" r="4" fill="#c2410c"/><text x="28" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">AWS<tspan font-weight="400" fill="#59636e"> · Free, Pro, Team</tspan></text></g><g class="chip c1" transform="translate(211,0)"><rect width="155" height="34" rx="17" fill="#eef1f4" stroke="#d1d9e0"/><circle cx="17" cy="17" r="4" fill="#c2410c"/><text x="28" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">Azure<tspan font-weight="400" fill="#59636e"> · preview</tspan></text></g><g class="chip c2" transform="translate(378,0)"><rect width="224" height="34" rx="17" fill="#eef1f4" stroke="#d1d9e0"/><circle cx="17" cy="17" r="4" fill="#c2410c"/><text x="28" y="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">Google Cloud<tspan font-weight="400" fill="#59636e"> · preview</tspan></text></g></g>
</svg>
