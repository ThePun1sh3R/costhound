# Copy to .github/workflows/costhound-azure.yml
# Secrets: COSTHOUND_LICENSE, AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Optional: COSTHOUND_SLACK_WEBHOOK
# App registration federated credential + Reader on the subscription: check this in your setup.
# After azure/login (OIDC), use -auth cli (Team). -auth service-principal needs AZURE_CLIENT_SECRET.

name: costhound Azure

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install costhound
        run: |
          curl -fsSL https://raw.githubusercontent.com/ThePun1sh3R/costhound/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore history
        uses: actions/cache/restore@v4
        with:
          path: .costhound-runs
          key: costhound-history-azure-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            costhound-history-azure-

      - name: Scan
        env:
          COSTHOUND_LICENSE: ${{ secrets.COSTHOUND_LICENSE }}
          COSTHOUND_SLACK_WEBHOOK: ${{ secrets.COSTHOUND_SLACK_WEBHOOK }}
        run: |
          costhound azure \
            -auth cli \
            -tenant "${{ secrets.AZURE_TENANT_ID }}" \
            -subscriptions "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -history-dir .costhound-runs \
            -html report.html \
            -fail-over 500 \
            -fail-on-new \
            -fail-on-unowned 200 \
            -json > report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: costhound-azure-report
          path: |
            report.html
            report.json
          if-no-files-found: ignore

      - name: Save history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .costhound-runs
          key: costhound-history-azure-${{ github.run_id }}-${{ github.run_attempt }}
